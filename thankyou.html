<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Gourmet au Catering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background-color: white;
            color: #333;
        }

        .thankyou-page {
            text-align: center;
            padding: 150px 20px;
        }

        .thankyou-page h1 {
            font-size: 48px;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 3px;
        }

        .thankyou-page p {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .thankyou-page a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background-color: #f1f1f1;
            color: black;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .thankyou-page a:hover {
            background-color: #ccc;
        }
        /* Fade-in animation */
.thankyou-page {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive design */
@media (max-width: 600px) {
    .thankyou-page {
        padding: 100px 15px;
    }

    .thankyou-page h1 {
        font-size: 32px;
    }

    .thankyou-page p {
        font-size: 16px;
    }

    .thankyou-page a {
        padding: 10px 18px;
    }
}
    </style>
</head>

<body>

    <main class="thankyou-page">
        <h1>Thank You!</h1>

        <p>Your message has been received.</p>

        <p>Thank you for contacting us. We appreciate your feedback.</p>

        <a href="Index.html">BACK TO HOME</a>
    </main>

</body>
</html>
