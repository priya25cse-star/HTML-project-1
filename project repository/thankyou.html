
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Gourmet au Catering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background: #f7f5f0;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .thankyou-page {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 65px 35px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            border-radius: 4px;
            animation: fadeIn 0.9s ease;
        }

        .checkmark {
            width: 75px;
            height: 75px;
            background: #e8eee5;
            color: #536b4d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 46px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .thankyou-page p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 15px;
            color: #666;
        }

        .brand {
            color: #8b7355;
            font-size: 17px;
            letter-spacing: 2px;
            margin-top: 30px;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            padding: 14px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .home-button:hover {
            background: #8b7355;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .thankyou-page {
                padding: 45px 20px;
            }

            h1 {
                font-size: 34px;
            }

            .thankyou-page p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="thankyou-page">

        <div class="checkmark">✓</div>

        <h1>Thank You!</h1>

        <p>Your request has been successfully received.</p>

        <p>
            We truly appreciate your interest in
            Gourmet au Catering.
            Our team will get back to you soon.
        </p>

        <div class="brand">
            GOURMET AU CATERING
        </div>

        <a href="Index.html" class="home-button">
            BACK TO HOME
        </a>

    </main>

</body>
</html>
