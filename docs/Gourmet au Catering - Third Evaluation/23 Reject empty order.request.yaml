$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrfToken}}"
body:
  type: json
  content: |-
    {
      "customerName": "Postman Evaluation Customer",
      "customerPhone": "9000000000",
      "items": []
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 23000
