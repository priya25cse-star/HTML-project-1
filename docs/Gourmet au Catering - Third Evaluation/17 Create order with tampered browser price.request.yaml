$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Token: "{{csrfToken}}"
body:
  type: json
  content: |-
    {
      "customerName": "Postman Evaluation Customer",
      "customerPhone": "9000000000",
      "items": [
        {
          "menuId": "bread-basket",
          "quantity": 2,
          "price": 0.01
        }
      ],
      "total": 0.01
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      const body=pm.response.json();pm.collectionVariables.set('orderId',body.orderId);pm.test('Uses authoritative menu price',function(){pm.expect(body.total).to.eql(Number(pm.collectionVariables.get('breadPrice'))*2);});
    language: text/javascript
order: 17000
